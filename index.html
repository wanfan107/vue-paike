<!DOCTYPE html>
<html lang="en">

<head>
  <script type="text/javascript" src="https://16c21bab4f2e.edge.captcha-sdk.awswaf.com/16c21bab4f2e/jsapi.js"
    defer></script>
  <script type="text/javascript" src="https://16c21bab4f2e.edge.sdk.awswaf.com/16c21bab4f2e/a7770918b40e/challenge.js"
    defer></script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image" href="/logoicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniVePay</title>
  <style>
    /* 基础样式重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }

    /* 应用容器过渡效果 */
    #app {
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #app.loaded {
      opacity: 1;
    }

    /* 高级加载动画样式 */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #8b0000 0%, #db0011 50%, #ff4757 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    /* 动态背景效果 */
    .loading-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      animation: backgroundShift 15s ease-in-out infinite;
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    /* 加载容器 */
    .loading-content {
      text-align: center;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* 多层旋转动画容器 */
    .spinner-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 多层圆环动画 */
    .spinner-ring {
      position: absolute;
      border-radius: 50%;
      border-style: solid;
      animation: spin 2s linear infinite;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    }

    .spinner-ring:nth-child(1) {
      width: 200px;
      height: 200px;
      border-width: 4px;
      border-color: rgba(255, 255, 255, 0.15) transparent rgba(255, 255, 255, 0.15) transparent;
      animation-duration: 3s;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
    }

    .spinner-ring:nth-child(2) {
      width: 150px;
      height: 150px;
      border-width: 3px;
      border-color: transparent rgba(255, 255, 255, 0.3) transparent rgba(255, 255, 255, 0.3);
      animation-duration: 2s;
      animation-direction: reverse;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    }

    .spinner-ring:nth-child(3) {
      width: 100px;
      height: 100px;
      border-width: 2px;
      border-color: rgba(255, 255, 255, 0.45) transparent rgba(255, 255, 255, 0.45) transparent;
      animation-duration: 1.5s;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* 中心Logo */
    .spinner-center {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2),
        0 0 20px rgba(255, 255, 255, 0.3),
        inset 0 2px 10px rgba(255, 255, 255, 0.7);
      animation: bounce 2s ease-in-out infinite;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.5);
    }

    .spinner-center::after {
      content: '';
      width: 40px;
      height: 40px;
      background: url('/logoicon.png') no-repeat center center;
      background-size: contain;
      display: block;
      animation: rotateSlow 4s ease-in-out infinite;
    }

    /* 加载文字 */
    .loading-text {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.5s forwards, glow 2s ease-in-out infinite alternate;
      background: linear-gradient(90deg, #ffffff, #ffecec, #ffffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      position: relative;
      animation: fadeInUp 1s ease-out 0.5s forwards,
        glow 2s ease-in-out infinite alternate,
        textShine 3s ease-in-out infinite;
    }

    /* 辅助文字 */
    .loading-subtext {
      font-size: 14px;
      opacity: 0.8;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeIn 1s ease-out 1s forwards, pulse 2s ease-in-out infinite;
      margin: 0;
      font-weight: 400;
    }

    /* 进度指示器 */
    .loading-progress {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 1s ease-out 1.5s forwards;
      margin-top: 10px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffffff, #ffecec);
      animation: progress 3s ease-out 1.5s infinite;
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(255, 180, 180, 0.8);
    }

    /* 动画关键帧 */
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateSlow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bounce {

      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-10px);
      }

      60% {
        transform: translateY(-5px);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 0.8;
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.6;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes glow {
      from {
        filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
      }

      to {
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
      }
    }

    @keyframes textShine {
      0% {
        background-position: 200% center;
      }

      100% {
        background-position: -200% center;
      }
    }

    @keyframes backgroundShift {

      0%,
      100% {
        transform: translateX(0) translateY(0);
      }

      25% {
        transform: translateX(-20px) translateY(-10px);
      }

      50% {
        transform: translateX(20px) translateY(10px);
      }

      75% {
        transform: translateX(-10px) translateY(20px);
      }
    }

    @keyframes progress {
      0% {
        width: 0%;
        animation-timing-function: ease-out;
      }

      90% {
        width: 95%;
        animation-timing-function: ease-in;
      }

      100% {
        width: 0%;
      }
    }

    /* 修改进度条动画，使其能够无限循环 */
    .progress-bar {
      animation: progress 3s ease-in-out 1.5s infinite;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .spinner-container {
        width: 150px;
        height: 150px;
      }

      .spinner-ring:nth-child(1) {
        width: 150px;
        height: 150px;
      }

      .spinner-ring:nth-child(2) {
        width: 110px;
        height: 110px;
      }

      .spinner-ring:nth-child(3) {
        width: 70px;
        height: 70px;
      }

      .spinner-center {
        width: 50px;
        height: 50px;
      }

      .spinner-center::after {
        width: 30px;
        height: 30px;
      }

      .loading-text {
        font-size: 20px;
        letter-spacing: 2px;
      }

      .loading-subtext {
        font-size: 13px;
      }

      .loading-progress {
        width: 150px;
      }
    }

    @media (max-width: 480px) {
      .loading-content {
        gap: 20px;
      }

      .loading-text {
        font-size: 18px;
        letter-spacing: 1.5px;
      }

      .loading-subtext {
        font-size: 12px;
      }

      .loading-progress {
        width: 120px;
      }
    }
  </style>
</head>

<body>
  <!-- 加载动画 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-content">
      <!-- 多层旋转动画 -->
      <div class="spinner-container">
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-center"></div>
      </div>

      <!-- 加载文字 -->
      <div class="loading-text">Loading</div>
      <div class="loading-subtext">System resources are being loaded</div>
    </div>
  </div>

  <!-- 应用容器 -->
  <div id="app"></div>

  <!-- 加载完成后隐藏加载动画 -->
  <script>
    // 监听DOM加载完成
    document.addEventListener('DOMContentLoaded', () => {
      // 当Vue应用挂载完成后隐藏加载动画
      const app = document.getElementById('app');
      const loadingScreen = document.getElementById('loadingScreen');

      // 观察app元素的变化
      const observer = new MutationObserver(() => {
        if (app.children.length > 0) {
          app.classList.add('loaded');
          loadingScreen.classList.add('hidden');
          observer.disconnect();
        }
      });

      observer.observe(app, { childList: true });

      // 为了防止观察器失效，添加超时处理
      setTimeout(() => {
        app.classList.add('loaded');
        loadingScreen.classList.add('hidden');
        observer.disconnect();
      }, 3000);
    });
  </script>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
